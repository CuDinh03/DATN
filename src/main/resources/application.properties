spring.application.name=DATN

# Default profile for local development
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/DATN?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (common defaults; override per profile as needed)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false



# SMTP Server Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Additional Mail Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.port=${SERVER_PORT:9091}
jwt.signerKey=${JWT_SIGNER_KEY:}
jwt.valid-duration=${JWT_VALID_DURATION:3600}
jwt.refreshable-duration=${JWT_REFRESHABLE_DURATION:36000}
spring.main.allow-bean-definition-overriding=true

# Flyway (enabled in prod profile)
spring.flyway.enabled=false

# Actuator (enabled when dependency present)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# CORS (restrict in prod)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
